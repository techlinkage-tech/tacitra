[workspace]
members = ["crates/tacitra-syntax", "crates/tacitra-semantics", "crates/tacitra-agent", "crates/tacitra-interop", "crates/tacitra-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
